name: test_workflow
on:
  workflow_run: 
    workflows: 
      - "lint-ci"
    types: 
      - completed
jobs:
  test_job:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: display previous workflow status
        run: echo "${{github.event.workflow_run.conclusion}}"      
      - name: test step 
        if: ${{always()}}
        run: echo " Allah Please Help Me"
      - name: test step 2
        if: ${{ github.event.workflow_run.conclusion == 'success'}}
        run: echo " Praying Again----Allah Please Help Me"